android.enableJetifier=true
# AGP 8+ generates R fields as non-final by default, which breaks
# "case R.id.xxx:" labels in switch statements (constant expression required).
# Keep them final so the existing Java sources compile unchanged.
android.nonFinalResIds=false
android.useAndroidX=true
android.jetifier.ignorelist=shadows-support-v4-3.4-rc2.jar
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=512m
